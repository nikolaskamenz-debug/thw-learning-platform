services:
  thw-app:
    build: .
    image: thw-learning-platform:latest
    container_name: thw-learning-platform

    # Bewusst kein "ports:". Der Dienst ist ausschliesslich ueber nginx
    # erreichbar, und nginx spricht ihn im gemeinsamen Docker-Netz unter
    # seinem Namen an. Wuerde hier 3000:3000 stehen, haenge die Plattform
    # wieder unverschluesselt am offenen Port — das war schon einmal so
    # und wurde abgestellt.

    env_file:
      - .env.local

    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://platform.thw-ai.de

    networks:
      - n8n_default

    restart: unless-stopped

networks:
  # Gehoert zur n8n-Installation unter /root/n8n und wird hier nur
  # mitbenutzt. Deshalb external — Compose legt es nicht an und raeumt
  # es auch nicht weg.
  n8n_default:
    external: true
